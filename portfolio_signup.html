<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="หน้าสมัครสมาชิกเว็บไซต์ Portfolio">
<title>สมัครสมาชิก | Portfolio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f4f8;color:#263238;line-height:1.7}
header,footer{background:#1565c0;color:#fff;text-align:center;padding:18px}
header h1{margin:0}
nav ul{list-style:none;padding:0;margin:8px 0 0;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none}
main{width:min(100% - 24px,620px);margin:28px auto}
.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 14px #00000015}
h2{color:#1565c0;margin-top:0}
label{display:block;font-weight:bold;margin:10px 0 4px}
input{width:100%;padding:11px;border:1px solid #b8c7d8;border-radius:7px;font:inherit}
input:focus{outline:2px solid #90caf9;border-color:#1565c0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button,.button{border:0;border-radius:8px;padding:11px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#1565c0;color:#fff}.secondary{background:#e3eaf2;color:#263238}
.note{background:#fff8e1;border-left:4px solid #f9a825;padding:12px;border-radius:6px;font-size:.92rem}
.message{min-height:26px;font-weight:bold}
@media(max-width:520px){.card{padding:17px}header h1{font-size:1.4rem}}
</style>
</head>
<body>
<header>
<h1>สมัครสมาชิก</h1>
<nav><ul>
<li><a href="index.html">หน้าแรก</a></li>
<li><a href="portfolio.html">Portfolio</a></li>
<li><a href="login.html">เข้าสู่ระบบ</a></li>
</ul></nav>
</header>
<main>
<section class="card">
<h2>สร้างบัญชีสมาชิก</h2>
<p class="note">นี่เป็นระบบสาธิตสำหรับงานเรียน ข้อมูลบัญชีจะเก็บไว้ชั่วคราวใน session ของเบราว์เซอร์เท่านั้น ไม่ควรใช้รหัสผ่านจริง และยังไม่ใช่ระบบสมาชิกที่ปลอดภัยสำหรับใช้งานจริง</p>
<form id="signupForm">
<label for="username">Username</label>
<input id="username" name="username" type="text" minlength="3" autocomplete="username" required>
<label for="password">Password</label>
<input id="passworหd" name="password" type="password" minlength="6" autocomplete="new-password" required>
<label for="fullname">ชื่อ-นามสกุล</label>
<input id="fullname" name="fullname" type="text" autocomplete="name" required>
<label for="age">อายุ</label>
<input
  id="age"
  name="age"
  type="number"
  min="1"
  max="99"
  step="1"
  required
>
<label for="phone">เบอร์โทรศัพท์</label>
<input
  id="phone"
  type="tel"
  inputmode="numeric"
  pattern="[0-9]{10}"
  minlength="10"
  maxlength="10"
  required
>
<label for="email">อีเมล</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<div class="actions">
<button class="primary" type="submit">ยืนยันสมัครสมาชิก</button>
<button class="secondary" type="reset">ยกเลิก</button>
<a class="button secondary" href="login.html">ไปหน้าเข้าสู่ระบบ</a>
</div>
<p class="message" id="message" aria-live="polite"></p>
</form>
</section>
</main>
<footer>เว็บไซต์ Portfolio นักศึกษา</footer>
<script>
document.getElementById('signupForm').addEventListener('submit', function(event){
  event.preventDefault();
  if(!this.reportValidity()) return;
  const account = {
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value,
    fullname: document.getElementById('fullname').value.trim(),
    age: document.getElementById('age').value,
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim()
  };
  // เก็บไว้ชั่วคราวเพื่อสาธิตการเปลี่ยนจากหน้าสมัครไปหน้าเข้าสู่ระบบ
  sessionStorage.setItem('portfolioDemoAccount', JSON.stringify(account));
  document.getElementById('message').textContent = 'สมัครสมาชิกสำเร็จ กำลังไปหน้าเข้าสู่ระบบ...';
  document.getElementById('message').style.color = '#2e7d32';
  setTimeout(function(){ window.location.href = 'login.html'; }, 700);
});
</script>
</body>
</html>
